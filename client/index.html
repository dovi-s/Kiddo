<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover enables env(safe-area-inset-*) on notched iOS devices.
         maximum-scale removed: blocking pinch-zoom is an accessibility regression
         (low-vision users rely on it). iOS input-zoom is prevented by ensuring all
         inputs use font-size: 16px+ instead. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Cash gifts disappear. Kiddo gifts last. Create a child's fund, share one link, and let family gift in under a minute." />
    <meta name="robots" content="index,follow" />

    <meta property="og:title" content="Kiddo | Cash Gifts Disappear. Kiddo Gifts Last." />
    <meta property="og:description" content="Create a child's fund, share one link, and let family send investment gifts in under a minute." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="/" />
    <meta property="og:site_name" content="Kiddo" />
    <meta property="og:image" content="/kiddo-og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@getkiddo" />
    <meta name="twitter:title" content="Kiddo | Cash Gifts Disappear. Kiddo Gifts Last." />
    <meta name="twitter:description" content="Create a child's fund, share one link, and let family send investment gifts in under a minute." />
    <meta name="twitter:image" content="/kiddo-og-image.png" />
    <meta name="twitter:image:alt" content="Kiddo gifting and investing preview" />

    <title>Kiddo</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- theme-color must match the color DIRECTLY under the iOS status bar — the
         cream AppHeader / body — so the status strip blends into the app instead
         of floating as a colored band above a cream header (the Acorns "seamless"
         effect is just bar-color === top-content-color). The app renders cream in
         BOTH OS appearances (no .dark class is ever applied — there is no theme
         provider), so the bar stays cream even when the phone is in dark mode;
         a dark-mode variant here would paint a black band over the cream app. -->
    <meta name="theme-color" content="#F9F7F3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- black-translucent (re-chosen 2026-06-27, founder: "the iphone part should
         change on scroll to MATCH the header"). iOS IGNORES theme-color in a
         standalone PWA, so the only way to make the status-bar strip follow the
         header's green↔cream scroll color is black-translucent: the web content
         (the AppHeader, which has paddingTop: safe-area-inset-top) draws UNDER the
         notch, so its background fills the status-bar area and tracks on scroll.
         KNOWN TRADEOFF (previously why we used "default"): black-translucent forces
         the clock/wifi/battery glyphs to ALWAYS be white — crisp over the green hero,
         but faint over cream once scrolled. iOS gives a PWA no way to flip glyph
         color per-scroll (only the native shell can). Revert to "default" if the
         cream-glyph faintness outweighs the green-hero match. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kiddo" />
    <!-- Fonts are self-hosted via @fontsource-variable (imported in
         src/main.tsx), not hotlinked. This removes third-party font CDN
         IP egress on child-viewed pages (Kid View). See
         COPPA_APPLICABILITY_MEMO.md. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
