<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover enables env(safe-area-inset-*) on notched iOS devices.
         maximum-scale removed: blocking pinch-zoom is an accessibility regression
         (low-vision users rely on it). iOS input-zoom is prevented by ensuring all
         inputs use font-size: 16px+ instead. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Cash gifts disappear. Kiddo gifts last. Create a child's fund, share one link, and let family gift in under a minute." />
    <meta name="robots" content="index,follow" />

    <meta property="og:title" content="Kiddo | Cash Gifts Disappear. Kiddo Gifts Last." />
    <meta property="og:description" content="Create a child's fund, share one link, and let family send investment gifts in under a minute." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="/" />
    <meta property="og:site_name" content="Kiddo" />
    <meta property="og:image" content="/kiddo-og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@getkiddo" />
    <meta name="twitter:title" content="Kiddo | Cash Gifts Disappear. Kiddo Gifts Last." />
    <meta name="twitter:description" content="Create a child's fund, share one link, and let family send investment gifts in under a minute." />
    <meta name="twitter:image" content="/kiddo-og-image.png" />
    <meta name="twitter:image:alt" content="Kiddo gifting and investing preview" />

    <title>Kiddo</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- theme-color must match the color DIRECTLY under the iOS status bar — the
         cream AppHeader / body — so the status strip blends into the app instead
         of floating as a green bar above a cream header (the Acorns "seamless"
         effect is just bar-color === top-content-color). Dark-mode variant matches
         the dark app background. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F9F7F3" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0C140F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- "default" = the standard LIGHT status bar (dark glyphs) — the right
         choice for our cream top: it blends into the cream AppHeader instead of
         standing out. (black-translucent was tried but it forces WHITE glyphs,
         which vanish on cream; that mode only suits a dark-colored top.) iOS
         reserves the status-bar area, so content sits below it — no under-the-clock
         offset needed. theme-color (cream, above) tints the same blend in browser. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kiddo" />
    <!-- Fonts are self-hosted via @fontsource-variable (imported in
         src/main.tsx), not hotlinked. This removes third-party font CDN
         IP egress on child-viewed pages (Kid View). See
         COPPA_APPLICABILITY_MEMO.md. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
