<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Occasion tiles — Index-Card Register</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700;800&display=swap');
  :root{
    --ink:33 22% 8%; --ivory:38 41% 95%; --ground:38 12% 97%;
    --gold:38 61% 48%; --gold-ink:34 74% 25%; --gain:143 47% 38%; --eg:158 49% 15%;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',system-ui,sans-serif;background:hsl(var(--ground));padding:40px}
  .h{font-family:'Bricolage Grotesque';font-size:17px;font-weight:800;color:hsl(var(--ink));margin-bottom:16px}
  .row{display:flex;gap:12px}

  .tile{width:140px;height:148px;border-radius:16px;background:hsl(var(--ivory));border:1px solid hsl(var(--ink)/.08);
    box-shadow:0 1px 2px hsl(var(--ink)/.06);padding:13px;display:flex;flex-direction:column}
  .glyph{width:34px;height:34px;border-radius:9999px;background:hsl(var(--ink)/.05);display:flex;align-items:center;justify-content:center;font-size:19px;line-height:1;position:relative}
  .name{margin-top:11px;font-size:13px;font-weight:600;color:hsl(var(--ink));line-height:1.2;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .date{margin-top:3px;font-size:10px;font-weight:500;color:hsl(var(--ink)/.5)}
  .date .soon{color:hsl(var(--gold-ink));font-weight:700}
  .spacer{flex:1}
  .val{font-size:13px;font-weight:600;color:hsl(var(--gold-ink));font-variant-numeric:tabular-nums}
  .val span{font-size:10px;font-weight:500;color:hsl(var(--ink)/.45)}

  /* soonest tile: one warm signal — faint gold well behind the glyph */
  .soonest .glyph{background:hsl(var(--gold)/.14)}

  /* goal tile: gain-green progress */
  .bar{height:3px;border-radius:9999px;background:hsl(var(--ink)/.08);margin-top:2px;overflow:hidden}
  .bar i{display:block;height:100%;width:64%;background:hsl(var(--gain))}
  .goal{font-size:10px;color:hsl(var(--ink)/.5);margin-top:4px}

  .add{width:140px;height:148px;border-radius:16px;border:1px dashed hsl(var(--ink)/.2);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:hsl(var(--eg));font-size:12px;font-weight:600}
  .add .p{font-size:20px}
</style>
</head>
<body>
  <div class="h">Theo's Occasions</div>
  <div class="row">
    <div class="tile soonest">
      <div class="glyph">🎂</div>
      <div class="name">Theo's Birthday</div>
      <div class="date">Nov 19 <span class="soon">· in 6d</span></div>
      <div class="spacer"></div>
      <div class="val">$2,415 <span>gifted</span></div>
    </div>
    <div class="tile">
      <div class="glyph">🎉</div>
      <div class="name">Theo's Holidays</div>
      <div class="date">Dec 25</div>
      <div class="spacer"></div>
      <div class="val">$350 <span>gifted</span></div>
    </div>
    <div class="tile">
      <div class="glyph">🎓</div>
      <div class="name">Graduation Fund</div>
      <div class="date">Goal</div>
      <div class="spacer"></div>
      <div class="val">$1,200 <span>of $5,000</span></div>
      <div class="bar"><i></i></div>
    </div>
    <div class="tile">
      <div class="glyph">🪔</div>
      <div class="name">Diwali</div>
      <div class="date">Nov 1</div>
      <div class="spacer"></div>
      <div class="val">$80 <span>gifted</span></div>
    </div>
    <div class="add"><div class="p">+</div>New occasion</div>
  </div>
</body>
</html>
