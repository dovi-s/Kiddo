<!DOCTYPE html><html><head><meta charset="UTF-8"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:linear-gradient(168deg,hsl(158 45% 19%),hsl(157 49% 8%));padding:48px;display:flex;flex-direction:column;gap:30px}
.lbl{color:hsl(40 70% 63%);font-size:12px;font-weight:700}
.pill{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.16);
  border-radius:9999px;padding:9px 16px;color:rgba(255,255,255,0.94);font-size:14px;width:fit-content}
.pill b{font-weight:800}.pill .t{font-weight:500}
svg{flex-shrink:0}
.arr{opacity:.8;flex-shrink:0}
</style></head><body>
<div><div class="lbl">A — current (text + arrow)</div>
<div class="pill"><span><b>~$51k</b> <span class="t">at 21</span></span><span class="arr">→</span></div></div>

<div><div class="lbl">B — TrendingUp lead + arrow</div>
<div class="pill"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="hsl(40 70% 63%)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg><span><b>~$51k</b> <span class="t">at 21</span></span><span class="arr">→</span></div></div>

<div><div class="lbl">C — TrendingUp lead, no arrow (my pick)</div>
<div class="pill"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="hsl(40 70% 63%)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg><span><b>~$51k</b> <span class="t">at 21</span></span></div></div>

<div><div class="lbl">D — white icon variant (C in white)</div>
<div class="pill"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg><span><b>~$51k</b> <span class="t">at 21</span></span></div></div>
</body></html>
