<!DOCTYPE html><html><head><meta charset="UTF-8"/>

.name{font-size:11px;color:#8a8073;margin-top:2px}
.rec{outline:2px solid hsl(38 61% 48%);outline-offset:2px}
svg{color:hsl(158 49% 15%)}
.tag{font-size:9px;font-weight:700;color:hsl(34 74% 25%)}

<div class="row">
